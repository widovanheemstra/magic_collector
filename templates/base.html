<!DOCTYPE html>
<html lang="en" data-theme="{{ theme if theme in ('light', 'dark') else 'light' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Magic Collector{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    <script>
        /* Resolve a "system" theme to light/dark before first paint and apply it. */
        (function() {
            var theme = {{ theme|tojson }};
            if (theme === 'system') {
                var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            }
        })();
    </script>
    <!-- Active theme stylesheet — href set synchronously before first paint -->
    <link id="appThemeStylesheet" rel="stylesheet" href="">
    <script>
        (function() {
            var themes = { ice: '/static/css/kaldheim-theme.css', dark: '/static/css/kaldheim-dark-theme.css' };
            var saved = localStorage.getItem('appTheme');
            if (saved && themes[saved]) document.getElementById('appThemeStylesheet').href = themes[saved];
        })();
    </script>
    <script>
        /* ── Tile image picker (URL / server gallery / upload) ──────────────
         * Used by both collection groups and decks. Defined in <head>,
         * before the page content block, so it already exists when a page's
         * own inline script calls it on a full load. */
        function initTileImagePicker(prefix) {
            const urlInput = document.getElementById(prefix + 'ImageUrl');
            const fileInput = document.getElementById(prefix + 'ImageFile');
            const galleryGrid = document.getElementById(prefix + 'ImageGallery');
            const preview = document.getElementById(prefix + 'ImagePreview');
            const previewWrap = document.getElementById(prefix + 'ImagePreviewWrap');
            if (!urlInput || !fileInput || !galleryGrid) return;

            function showPreview(src) {
                if (!src) { previewWrap.style.display = 'none'; preview.src = ''; return; }
                preview.src = src;
                previewWrap.style.display = 'block';
            }

            urlInput.addEventListener('input', () => showPreview(urlInput.value.trim()));

            fileInput.addEventListener('change', () => {
                if (!fileInput.files.length) return;
                urlInput.value = '';
                const reader = new FileReader();
                reader.onload = e => showPreview(e.target.result);
                reader.readAsDataURL(fileInput.files[0]);
            });

            galleryGrid.addEventListener('click', (e) => {
                const thumb = e.target.closest('[data-url]');
                if (!thumb) return;
                fileInput.value = '';
                urlInput.value = thumb.dataset.url;
                showPreview(thumb.dataset.url);
            });

            fetch('/api/tile_gallery_images')
                .then(r => r.json())
                .then(data => {
                    if (!data.images || !data.images.length) {
                        galleryGrid.innerHTML = '<p class="text-muted small mb-0">No images in the project gallery yet. Drop image files into <code>static/group_gallery/</code>.</p>';
                        return;
                    }
                    galleryGrid.innerHTML = data.images.map(url =>
                        `<img src="${url}" data-url="${url}" class="border rounded" style="width:96px;height:96px;object-fit:contain;cursor:pointer;padding:4px;">`
                    ).join('');
                })
                .catch(err => {
                    galleryGrid.innerHTML = `<p class="text-danger small mb-0">Could not load gallery images: ${err.message}</p>`;
                });

            showPreview(urlInput.value.trim());
        }
    </script>
    <style>
        .card-image {
            width: 100%;
            height: auto;
            max-height: 300px;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .card-img-top { padding: 10px; }
        .set-card { transition: transform 0.2s; }
        .set-card:hover { transform: translateY(-5px); }
        .mana-symbol { width: 20px; height: 20px; display: inline-block; margin-right: 2px; }

        /* ── Collection group image gallery picker ─────────────────────── */
        .group-gallery-grid {
            max-height: 260px;
            overflow-y: auto;
            align-content: flex-start;
        }
        .group-gallery-grid img {
            transition: border-color .15s;
        }
        .group-gallery-grid img:hover {
            border-color: #0d6efd !important;
        }
    </style>
</head>
<body>
    <div class="mc-shell">
        {% include "_sidebar.html" %}
        <main class="mc-main" id="spaContent">
            {% block content %}{% endblock %}
        </main>
    </div>
    {% include "_tabbar.html" %}
    {% include "_add_cards_modal.html" %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0/dist/umd/lucide.min.js"></script>
    <script>
        /* ── Lucide icons ─────────────────────────────────────────────────
         * Replace <i data-lucide="..."> placeholders with inline SVGs.
         * Called on load and after every SPA content swap. */
        function renderLucideIcons() {
            if (window.lucide && lucide.createIcons) {
                lucide.createIcons();
            }
        }
        document.addEventListener('DOMContentLoaded', function() { renderLucideIcons(); });
    </script>
    <script>
        /* ── Quick find (⌘K / sidebar field) ─────────────────────────────
         * Autocomplete card names from /api/card_names; Enter jumps to the
         * card detail page for the exact name (via /api/card_by_name). */
        function initQuickFind() {
            const input = document.getElementById('quickFind');
            if (!input) return;
            const list = document.getElementById('quickFindList');
            let timer = null;

            input.addEventListener('input', function() {
                clearTimeout(timer);
                const q = input.value.trim();
                if (q.length < 2) { if (list) list.innerHTML = ''; return; }
                timer = setTimeout(async function() {
                    try {
                        const r = await fetch('/api/card_names?q=' + encodeURIComponent(q));
                        const data = await r.json();
                        if (list) list.innerHTML = (data.names || []).map(function(n) {
                            return '<option value="' + n.replace(/"/g, '&quot;') + '">';
                        }).join('');
                    } catch (e) { /* ignore */ }
                }, 150);
            });

            function go(name) {
                if (!name) return;
                fetch('/api/card_by_name?name=' + encodeURIComponent(name))
                    .then(function(r) { return r.ok ? r.json() : null; })
                    .then(function(card) {
                        if (card && card.id) window.location.href = '/card/' + card.id;
                    });
            }

            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') { e.preventDefault(); go(input.value.trim()); }
            });
        }

        // ⌘K / Ctrl+K focuses the quick-find field from anywhere.
        document.addEventListener('keydown', function(e) {
            if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                const input = document.getElementById('quickFind');
                if (input) { input.focus(); input.select(); }
            }
        });

        document.addEventListener('DOMContentLoaded', initQuickFind);

        /* ── SPA Router ─────────────────────────────────────────────────── *
         *  Intercepts same-origin link clicks and swaps #spaContent only,  *
         *  keeping the navbar (and its loaded theme) alive across pages.   *
         * ────────────────────────────────────────────────────────────────── */
        (function() {
            var pageAssets = []; // <link>/<style> hoisted from current page into <head>

            function cleanPageAssets() {
                pageAssets.forEach(function(el) { if (el.parentNode) el.parentNode.removeChild(el); });
                pageAssets = [];
            }

            // Scripts injected via innerHTML do not execute; recreate them.
            function runScripts(container) {
                container.querySelectorAll('script').forEach(function(old) {
                    var s = document.createElement('script');
                    Array.from(old.attributes).forEach(function(a) { s.setAttribute(a.name, a.value); });
                    s.textContent = old.textContent;
                    old.parentNode.replaceChild(s, old);
                });
            }

            function navigate(url, push) {
                if (push === undefined) push = true;
                document.querySelectorAll('.modal.show').forEach(function(el) {
                    var m = bootstrap.Modal.getInstance(el);
                    if (m) m.hide();
                });

                fetch(url)
                    .then(function(r) {
                        if (!r.ok) throw new Error(r.status);
                        var finalUrl = new URL(r.url).pathname + new URL(r.url).search;
                        return r.text().then(function(html) { return { html: html, url: finalUrl }; });
                    })
                    .then(function(res) {
                        var doc = new DOMParser().parseFromString(res.html, 'text/html');
                        var newEl = doc.getElementById('spaContent');
                        var container = document.getElementById('spaContent');
                        if (!newEl || !container) { window.location.href = url; return; }

                        if (push) history.pushState({ url: res.url }, '', res.url);
                        var t = doc.querySelector('title');
                        if (t) document.title = t.textContent;

                        cleanPageAssets();

                        // Hoist page-specific <link>/<style> to <head> before replacement
                        newEl.querySelectorAll('link[rel="stylesheet"], style').forEach(function(el) {
                            document.head.appendChild(el);
                            pageAssets.push(el);
                        });

                        // Safe: content is always fetched from same-origin only
                        // (enforced by the origin check in the click handler below)
                        container.innerHTML = newEl.innerHTML; // nosec
                        runScripts(container);
                        renderLucideIcons();
                        window.scrollTo(0, 0);
                    })
                    .catch(function() { window.location.href = url; });
            }

            window.spaNavigate = navigate;

            document.addEventListener('click', function(e) {
                var a = e.target.closest('a[href]');
                if (!a) return;
                if (a.hasAttribute('data-bs-toggle') || a.hasAttribute('data-bs-dismiss')) return;
                if (a.hasAttribute('download') || a.target === '_blank' || a.hasAttribute('data-no-spa')) return;
                var href = a.getAttribute('href');
                if (!href || href.charAt(0) === '#') return;
                try {
                    var url = new URL(href, window.location.origin);
                    if (url.origin !== window.location.origin) return; // enforce same-origin
                    e.preventDefault();
                    navigate(url.pathname + url.search + url.hash);
                } catch(err) { /* invalid URL, let browser handle */ }
            });

            window.addEventListener('popstate', function() {
                navigate(window.location.pathname + window.location.search + window.location.hash, false);
            });
        })();

        /* ── Existing app helpers ───────────────────────────────────────── */
        function fetchSets() {
            fetch('/fetch_sets', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) { alert(data.message); location.reload(); }
                    else { alert('Error: ' + data.message); }
                });
        }

        function fetchCards(setCode) {
            fetch(`/fetch_cards/${setCode}`, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) { alert(data.message); location.reload(); }
                    else { alert('Error: ' + data.message); }
                });
        }
    </script>
</body>
</html>
